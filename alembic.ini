# Alembic configuration for GIBDD Mini App PostgreSQL migrations
# Generated for Phase 0: Architectural Stabilization

[alembic]
# path to migration scripts
script_location = alembic/migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library.
# Any required deps can installed by adding `alembic[tz]` to the pip requirements
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# sources/ directory
# py_source_policy = true
# py_file_policy = true

# version table name
version_table = alembic_version

# version table schema
# version_table_schema = public

# SQLAlchemy URL — будет переопределено в env.py через DATABASE_URL
# Это значение по умолчанию для локальной разработки
sqlalchemy.url = driver://user:pass@localhost/dbname

# Output logging
logging_config = %(here)s/alembic/logging.conf

version_path_separator = os

[post_write_hooks]
# Run black on migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# Run isort on migration files
# hooks = isort
# isort.type = exec
# isort.executable = isort
# isort.options = --profile black

# Custom Post-write hooks
# Run custom script after generating migration
hooks = custom_format
custom_format.type = string
custom_format.string = echo "Migration created successfully!"

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
