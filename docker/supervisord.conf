# ============================================================
# supervisord.conf — multi-process конфигурация для bothost.ru
#
# Запускает 4 процесса в одном контейнере:
#   1. redis-server  — брокер Celery + result backend + pub/sub
#   2. api           — FastAPI + Telegram webhook (uvicorn, 1 worker)
#   3. worker        — Celery worker (4 очереди, concurrency=4)
#   4. beat          — Celery beat (периодические задачи)
#
# Оптимизировано под bothost-сервер: 4 vCPU / 2 ГБ RAM / 15 ГБ NVMe
#   - Redis: maxmemory 128mb (вместо 256mb), без AOF (экономит RAM и диск)
#   - Worker: --max-tasks-per-child=10 (чаще перезапуск для освобождения памяти)
#   - API: 1 uvicorn worker (Telegram webhook требует единственного процесса)
#
# Использование:
#   supervisord -n -c /etc/supervisord.conf
#
# Логи:
#   /var/log/supervisor/  — логи supervisor + каждой программы отдельно
#   docker logs <container>  — все логи смешаны (через stdout supervisord)
# ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
loglevel=info
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

# RPC интерфейс для supervisorctl
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock


# ============================================================
# 1. Redis — брокер + result backend + pub/sub
# ============================================================
# Оптимизации под 2 ГБ RAM сервер:
#   - maxmemory 128mb (вместо 256mb) — достаточно для:
#       broker queue:  ~50KB/задача × 100 задач = 5MB
#       result backend: ~10KB/результат × 100 = 1MB
#       pub/sub:        ~1MB/стрим × 5 = 5MB
#       task state:     ~5KB/задача × 100 = 0.5MB
#     Итого ~12MB, запас 116MB
#   - allkeys-lru — при нехватке памяти вытеснять любые ключи (LRU)
#   - save "" — отключить RDB snapshots (диск не тратится, при рестарте
#     контейнера in-flight задачи и так потеряются — acks_late вернёт их в очередь)
#   - appendonly no — отключить AOF (экономит ~50MB RAM и диск)
#
# Если нужна персистентность Redis при рестарте — раскомментируйте save и appendonly,
# но это потребует дополнительно ~50-100MB RAM и место на диске.
[program:redis]
command=/usr/local/bin/redis-server
    --maxmemory 128mb
    --maxmemory-policy allkeys-lru
    --save ""
    --appendonly no
    --maxclients 100
    --timeout 300
    --tcp-keepalive 60
    --loglevel notice
    --dir /data/redis
directory=/app
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/redis.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/redis.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
priority=10


# ============================================================
# 2. API — FastAPI + Telegram webhook (uvicorn, 1 worker)
# ============================================================
# ВАЖНО: ровно 1 uvicorn worker — Telegram webhook требует единственного
# процесса-получателя (иначе Telegram будет слать updates случайному).
#
# Порт берётся из $PORT (bothost передаёт, обычно 3000 или 8080).
# Если $PORT не задан — fallback на 8080.
#
# --access-log отключён (логи access логов засоряют stdout, основных
# логов FastAPI достаточно). При необходимости отладки включите обратно.
[program:api]
command=/usr/local/bin/uvicorn main:app
    --host 0.0.0.0
    --port %(ENV_PORT)s
    --workers 1
    --no-access-log
    --proxy-headers
    --forwarded-allow-ips=*
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/api.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=REDIS_URL="redis://127.0.0.1:6379/0",CELERY_BROKER_URL="redis://127.0.0.1:6379/1",CELERY_RESULT_BACKEND="redis://127.0.0.1:6379/2",USE_CELERY="true"
priority=20


# ============================================================
# 3. Celery worker — обработка задач из 4 очередей
# ============================================================
# --concurrency=4 — по числу vCPU на bothost-сервере (4 vCPU)
#   Каждая задача работает в отдельном процессе (Celery prefork)
#
# --max-tasks-per-child=10 — worker-процесс перезапускается после 10 задач
#   (вместо 50 по умолчанию). Защита от утечек памяти в long-running процессах
#   с pandas/shapely/openpyxl. На 2 ГБ RAM это критично.
#
# -Q gibdd,llm,clusters,exports,celery — все 5 очередей в одном worker
#   (упрощает конфигурацию, на 4 vCPU этого достаточно)
#
# --time-limit=600 — hard kill через 10 минут
# --soft-time-limit=540 — SoftTimeLimitExceeded через 9 минут
#   (задача может завершиться gracefully, сохранив промежуточный результат)
[program:worker]
command=/usr/local/bin/celery
    -A worker.celery_app worker
    --loglevel=info
    --concurrency=4
    -Q gibdd,llm,clusters,exports,celery
    --max-tasks-per-child=10
    --time-limit=600
    --soft-time-limit=540
    --prefetch-multiplier=1
directory=/app
autostart=true
autorestart=true
startsecs=15
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/worker.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=REDIS_URL="redis://127.0.0.1:6379/0",CELERY_BROKER_URL="redis://127.0.0.1:6379/1",CELERY_RESULT_BACKEND="redis://127.0.0.1:6379/2",USE_CELERY="true",C_FORCE_ROOT="true"
priority=30


# ============================================================
# 4. Celery beat — периодические задачи
# ============================================================
# Запускается после worker (priority=40).
# Использует /tmp/celerybeat-schedule для хранения расписания
# (файл shelve, ~10KB).
#
# --max-loop-interval=60 — beat проверяет расписание раз в минуту
#   (по умолчанию 0 = максимально часто, но это лишняя нагрузка)
[program:beat]
command=/usr/local/bin/celery
    -A worker.celery_app beat
    --loglevel=info
    --schedule=/tmp/celerybeat-schedule
    --max-loop-interval=60
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/beat.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/beat.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=REDIS_URL="redis://127.0.0.1:6379/0",CELERY_BROKER_URL="redis://127.0.0.1:6379/1",CELERY_RESULT_BACKEND="redis://127.0.0.1:6379/2",USE_CELERY="true",C_FORCE_ROOT="true"
priority=40
