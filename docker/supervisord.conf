# ============================================================
# supervisord.conf — multi-process конфигурация для bothost.ru
#
# Запускает 4 процесса в одном контейнере:
#   1. redis-server  — брокер Celery + result backend + pub/sub
#   2. api           — FastAPI + Telegram webhook (uvicorn, 1 worker)
#   3. worker        — Celery worker (4 очереди, concurrency=2 по умолчанию)
#   4. beat          — Celery beat (периодические задачи)
#
# Оптимизировано под bothost-сервер: 4 vCPU / 2 ГБ RAM / 15 ГБ NVMe
#
# Stabilization A6 fixes:
#   - --max-tasks-per-child теперь берётся из env CELERY_MAX_TASKS_PER_CHILD
#     (раньше был хардкод =10, env игнорировался)
#   - stdout/stderr всех программ перенаправлены в /dev/stdout, /dev/stderr,
#     чтобы docker logs их видел (раньше писались в /var/log/supervisor/*.log
#     и были невидимы без docker exec)
#   - --concurrency снижен с 4 до 2 по умолчанию (через env CELERY_WORKER_CONCURRENCY),
#     чтобы убрать риск OOM на 2GB RAM. На bothost 4 vCPU это всё ещё достаточно
#     для текущей нагрузки (единицы задач в минуту)
#   - Все ключевые параметры теперь параметризованы через env, что упрощает
#     отладку без передеплоя образа
#
# Использование:
#   supervisord -n -c /etc/supervisord.conf
#
# Логи:
#   docker logs <container> — все логи смешаны в stdout (через supervisord)
# ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

# RPC интерфейс для supervisorctl
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock


# ============================================================
# 1. Redis — брокер + result backend + pub/sub
# ============================================================
[program:redis]
# Путь к redis-server. На python:3.11-slim (Debian Bookworm) apt-get install
# redis-server кладёт бинарник в /usr/bin/redis-server, НЕ в /usr/local/bin/.
# Если поменять базовый образ — перепроверить путь через `which redis-server`.
command=/usr/bin/redis-server
    --maxmemory 128mb
    --maxmemory-policy allkeys-lru
    --save ""
    --appendonly no
    --maxclients 100
    --timeout 300
    --tcp-keepalive 60
    --loglevel notice
    --dir /data/redis
directory=/app
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stopasgroup=true
killasgroup=true
# Stabilization A6: логи в stdout/stderr, чтобы docker logs их видел
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10


# ============================================================
# 2. API — FastAPI + Telegram webhook (uvicorn, 1 worker)
# ============================================================
# ВАЖНО: ровно 1 uvicorn worker — Telegram webhook требует единственного
# процесса-получателя (иначе Telegram будет слать updates случайному).
#
# Порт берётся из $PORT (bothost передаёт, обычно 3000 или 8080).
# Если $PORT не задан — fallback на 8080.
[program:api]
command=/usr/local/bin/uvicorn main:app
    --host 0.0.0.0
    --port %(ENV_PORT)s
    --workers 1
    --no-access-log
    --proxy-headers
    --forwarded-allow-ips=*
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
# Stabilization A6: логи в stdout/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=REDIS_URL="redis://127.0.0.1:6379/0",CELERY_BROKER_URL="redis://127.0.0.1:6379/1",CELERY_RESULT_BACKEND="redis://127.0.0.1:6379/2",USE_CELERY="true"
priority=20


# ============================================================
# 3. Celery worker — обработка задач из 4 очередей
# ============================================================
# --concurrency: число parallel воркеров (по умолчанию 2).
#   Снижено с 4 до 2 (Stabilization A6): на 2GB RAM 4 prefork-процесса
#   рискованно (пик ~900MB только для worker + 300MB uvicorn + 150MB Redis).
#   2 процесса дают пик ~500MB — запас в ~250MB на OS и кэш.
#   Если vCPU > 4 и RAM > 2GB — можно повысить через env CELERY_WORKER_CONCURRENCY.
#
# --max-tasks-per-child: число задач на процесс перед перезапуском.
#   Берётся из env CELERY_MAX_TASKS_PER_CHILD (раньше был хардкод =10).
#   entrypoint.sh задаёт default=10 если env не задан.
#
# -Q gibdd,llm,clusters,exports,celery — все 5 очередей в одном worker
#
# --time-limit=600 — hard kill через 10 минут
# --soft-time-limit=540 — SoftTimeLimitExceeded через 9 минут
[program:worker]
command=/usr/local/bin/celery
    -A worker.celery_app worker
    --loglevel=info
    --concurrency=%(ENV_CELERY_WORKER_CONCURRENCY)s
    -Q gibdd,llm,clusters,exports,celery
    --max-tasks-per-child=%(ENV_CELERY_MAX_TASKS_PER_CHILD)s
    --time-limit=600
    --soft-time-limit=540
    --prefetch-multiplier=1
directory=/app
autostart=true
autorestart=true
startsecs=15
stopwaitsecs=60
stopasgroup=true
killasgroup=true
# Stabilization A6: логи в stdout/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=REDIS_URL="redis://127.0.0.1:6379/0",CELERY_BROKER_URL="redis://127.0.0.1:6379/1",CELERY_RESULT_BACKEND="redis://127.0.0.1:6379/2",USE_CELERY="true",C_FORCE_ROOT="true"
priority=30


# ============================================================
# 4. Celery beat — периодические задачи
# ============================================================
[program:beat]
command=/usr/local/bin/celery
    -A worker.celery_app beat
    --loglevel=info
    --schedule=/tmp/celerybeat-schedule
    --max-interval=60
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
# Stabilization A6: логи в stdout/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=REDIS_URL="redis://127.0.0.1:6379/0",CELERY_BROKER_URL="redis://127.0.0.1:6379/1",CELERY_RESULT_BACKEND="redis://127.0.0.1:6379/2",USE_CELERY="true",C_FORCE_ROOT="true"
priority=40
